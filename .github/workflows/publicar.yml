name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compilar el instalador (la etiqueta debe coincidir con la versión del programa)
        shell: powershell
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          $v = $env:ETIQUETA.TrimStart('v')
          .\instalador\compilar.ps1 -Version $v

      # ---- Firma digital (SignPath Foundation) ----
      # Solo corre si el proyecto ya fue aprobado y configurado en SignPath:
      #   variable del repositorio SIGNPATH_ORGANIZATION_ID y secreto SIGNPATH_API_TOKEN.
      # Sin esas dos cosas la release sale sin firma, como hasta ahora.
      # [POR CONFIRMAR] nombres exactos de las entradas y la version de la accion en
      # https://docs.signpath.io/trusted-build-systems/github antes de la primera firma.
      - name: Subir el instalador sin firmar (entrada para SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: sinfirmar
        uses: actions/upload-artifact@v7
        with:
          name: instalador-sin-firmar
          path: salida/PCCare-Setup-*-x64.exe

      - name: Firmar con SignPath (la aprobación de cada versión es manual)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.sinfirmar.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: firmado

      - name: Reemplazar por el instalador firmado y comprobar la firma
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          $v = $env:ETIQUETA.TrimStart('v')
          $nombre = "PCCare-Setup-$v-x64.exe"
          $firmado = Get-ChildItem -Path firmado -Recurse -Filter $nombre | Select-Object -First 1
          if (-not $firmado) { throw "SignPath no devolvió $nombre" }
          Copy-Item -LiteralPath $firmado.FullName -Destination "salida\$nombre" -Force
          $firma = Get-AuthenticodeSignature -LiteralPath "salida\$nombre"
          Write-Host ("Firma: {0} | Firmante: {1}" -f $firma.Status, $firma.SignerCertificate.Subject)
          if ($firma.Status -ne 'Valid') { throw ("La firma no es válida: " + $firma.Status) }
          # el SHA256 publicado debe ser el del archivo firmado
          $h = (Get-FileHash "salida\$nombre" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\salida\$nombre.sha256", "$h  $nombre`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Probar el instalador (instalar, comparar archivos, desinstalar)
        shell: powershell
        run: .\instalador\probar.ps1

      - name: Armar el ZIP portable y su SHA256
        shell: powershell
        env:
          ETIQUETA: ${{ github.ref_name }}
        run: |
          $v = $env:ETIQUETA.TrimStart('v')
          $dest = "PCCare-$v-portable"
          New-Item -ItemType Directory -Path $dest | Out-Null
          Copy-Item lanzador\bin\PCCare.exe, PCCare.ps1, 'Iniciar PC Care.cmd', 'Autoprueba PC Care.cmd', README.md, LICENSE, CHANGELOG.md, SECURITY.md -Destination $dest
          Copy-Item modulos -Destination $dest -Recurse
          Compress-Archive -Path $dest -DestinationPath "salida\$dest.zip"
          $h = (Get-FileHash "salida\$dest.zip" -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD\salida\$dest.zip.sha256", "$h  $dest.zip`n", (New-Object System.Text.UTF8Encoding($false)))

      - name: Certificar el origen de los archivos (attestation)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            salida/PCCare-Setup-*-x64.exe
            salida/PCCare-*-portable.zip

      - name: Crear la release
        # pwsh lee el script en UTF-8; Windows PowerShell 5.1 lo leia como ANSI y rompia las tildes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETA: ${{ github.ref_name }}
          FIRMADO: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'si' || 'no' }}
        run: |
          $v = $env:ETIQUETA.TrimStart('v')
          if ($env:FIRMADO -eq 'si') {
            $avisoFirma = "El instalador está firmado digitalmente (Authenticode). Free code signing provided by SignPath.io, certificate by SignPath Foundation. Comprueba la firma con clic derecho, Propiedades, Firmas digitales, o con ``Get-AuthenticodeSignature``. La versión portable (ZIP) no se firma: verifica su SHA256 y su attestation."
            $avisoFirmaEn = "The installer is digitally signed (Authenticode). Free code signing provided by SignPath.io, certificate by SignPath Foundation. The portable ZIP is not signed: verify its SHA256 and attestation."
          }
          else {
            $avisoFirma = "El instalador aún no está firmado digitalmente, por lo que Windows puede mostrar ""Windows protegió su PC"". Pulsa **Más información** y luego **Ejecutar de todas formas**, después de verificar el SHA256."
            $avisoFirmaEn = "The installer is not digitally signed yet, so Windows may show ""Windows protected your PC"". Click **More info** and then **Run anyway**, after verifying the SHA256."
          }
          $notas = @"
          ## Descarga

          - **Instalador para Windows de 64 bits:** ``PCCare-Setup-$v-x64.exe``
          - **Versión portable (sin instalar):** ``PCCare-$v-portable.zip``

          ## Verificar la descarga

          ``````powershell
          Get-FileHash .\PCCare-Setup-$v-x64.exe -Algorithm SHA256
          gh attestation verify .\PCCare-Setup-$v-x64.exe --repo marcoadtup-cmd/PCCare
          ``````

          El hash debe coincidir con el archivo ``.sha256``. El comando ``gh attestation verify`` comprueba que el archivo lo compiló GitHub Actions desde este repositorio.

          ## Firma digital y SmartScreen

          $avisoFirma

          ## Language

          PC Care includes a Spanish and English interface. Use the language list at the top right of the window. $avisoFirmaEn

          ## Cambios

          Detalle completo en [CHANGELOG.md](https://github.com/marcoadtup-cmd/PCCare/blob/main/CHANGELOG.md).
          "@
          $notas = ($notas -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          [System.IO.File]::WriteAllText("$PWD\notas.md", $notas, (New-Object System.Text.UTF8Encoding($false)))
          gh release create $env:ETIQUETA "salida\PCCare-Setup-$v-x64.exe" "salida\PCCare-Setup-$v-x64.exe.sha256" "salida\PCCare-$v-portable.zip" "salida\PCCare-$v-portable.zip.sha256" --title "PC Care $v" --notes-file notas.md
